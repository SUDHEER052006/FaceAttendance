# ============================================================
#  Face Attendance - single-box Raspberry Pi 5 configuration
#  Everything tunable lives here. Edit, then: sudo systemctl
#  restart fa-recognizer fa-web   (or just re-run ./run.sh)
# ============================================================

site:
  name: "Main Gate"
  timezone: "Asia/Kolkata"

camera:
  source: picamera2         # picamera2 (on Pi) | opencv (laptop/USB webcam testing)
  opencv_index: 0
  lores: [640, 480]         # detection stream - keep small, this is the hot path
  main: [1536, 864]         # crop stream - faces are cut from here for embedding
  hflip: false
  vflip: false
  roi: null                 # [x, y, w, h] in lores pixels. null = whole frame.
  idle_fps: 5               # when nothing is moving
  active_fps: 15            # when motion is detected

detect:
  model: models/face_detection_yunet_2023mar.onnx
  score_threshold: 0.75
  nms_threshold: 0.3
  top_k: 20
  min_face_px: 70           # faces smaller than this (in lores px) are ignored

embed:
  model: models/w600k_mbf.onnx
  threads: 2                # ONNX Runtime intra-op threads. Leave at 2 on a Pi 5.

match:
  threshold: 0.40           # cosine similarity. TUNE THIS with scripts/tune_threshold.py
  margin: 0.05              # best match must beat runner-up by this much
  votes_required: 4         # agreeing frames before an attendance event is written
  vote_window: 10           # out of this many recent frames on the same track

quality:
  min_blur: 55.0            # Laplacian variance on the aligned crop
  min_brightness: 45
  max_brightness: 215
  max_yaw_ratio: 0.38       # nose offset from eye-midpoint / eye-distance

liveness:
  enabled: true
  model: models/minifasnet.onnx   # optional. Heuristic engine is used if absent.
  threshold: 0.55

motion:
  enabled: true             # the single biggest 24/7 CPU saver - keep it on
  threshold: 2.2            # mean abs frame diff to count as motion
  cooldown_s: 6             # stay in active mode this long after last motion

attendance:
  # The same person seen again inside this window is ignored completely - no
  # event row, no face image, no attendance change. This is the single setting
  # that stops one person at the door becoming forty log entries.
  min_rescan_gap_s: 90
  # A later sighting is only treated as a DEPARTURE if it is at least this far
  # after check-in. Somebody who loiters at the gate for ten minutes has not
  # gone home, so they must not get a ten-minute working day.
  min_work_minutes: 90
  shift_start: "09:00"
  shift_end: "18:00"
  grace_minutes: 10         # arrive within this after shift_start = still on time
  half_day_minutes: 240     # worked less than this = half day

# ------------------------------------------------------------------ privacy
# Defaults are deliberately the private ones. A face crop is biometric data:
# storing it, and putting it on a wall-mounted screen, both need a reason.
privacy:
  # Keep a face crop alongside each attendance event, as photographic proof of
  # the punch. Off by default. When on, the crop is visible only on that
  # person's own detail page, which requires a login - never in the live
  # activity feed, because the kiosk screen needs no login to watch and is
  # usually mounted where the whole lobby can read it.
  store_event_thumbs: false
  blur_kiosk_preview: false   # blur detected faces in the live camera preview
  log_unknown_faces: true     # keep snapshots of unmatched faces for review
  unknown_cooldown_s: 300     # and no more than one snapshot per face per window

tracker:
  iou_threshold: 0.3
  max_age: 12               # frames a track survives without a detection

web:
  host: 0.0.0.0
  port: 8000
  admin_pin: "1234"         # quick unlock on the touchscreen. CHANGE THIS.
  session_days: 7

paths:
  db: data/attendance.db
  frame: /dev/shm/fa_frame.jpg
  unknowns: data/unknowns
  faces: data/faces

retention:
  unknown_days: 14          # unknown-visitor snapshots auto-purge after this
  event_days: 400
